name: Venus8 Full-Market Technical-A Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy pydantic
      - name: Run exact Venus8 full-market scan
        shell: bash
        run: |
          mkdir -p results
          set +e
          python scan_venus.py > results/scan.log 2>&1
          status=$?
          cat results/scan.log
          exit $status
      - name: Upload results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venus8-technical-a-20260724
          path: results/
          if-no-files-found: error
