name: Venus8 Full-Market Technical-A Scan

on:
  push:
    branches: [main]
    paths:
      - 'scan_multisource.py'
      - 'venus_runtime.b64'
      - '.github/workflows/venus_scan.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy pydantic
      - name: Run exact Venus8 multi-source full-market scan
        shell: bash
        run: |
          set -o pipefail
          python scan_multisource.py 2>&1 | tee venus_scan.log
      - name: Upload results and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venus8-technical-a-20260724
          path: |
            results/
            venus_scan.log
          if-no-files-found: warn
          retention-days: 3
