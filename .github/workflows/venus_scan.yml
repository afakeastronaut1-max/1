name: Venus8 Full-Market Technical-A Scan

on:
  push:
    branches: [main]
    paths:
      - 'scan_venus.py'
      - 'venus_runtime.b64'
      - '.github/workflows/venus_scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install scanner dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy pydantic
      - name: Run exact Venus8 full-market scan
        run: python scan_venus.py
      - name: Commit scan results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/
          git commit -m 'Add Venus8 2026-07-24 technical-A scan results' || exit 0
          git push
